[project]
name = "bes-scraper"
version = "0.1.0"
description = "Headless PTW batch downloader for service.globalbes.sg"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.scripts]
ptw-scraper = "ptw_scraper:main"

[tool.setuptools]
py-modules = ["ptw_scraper"]
